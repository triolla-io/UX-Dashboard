<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Usage Log — Triolla Admin</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0c0d12; color: #e7e8ee; padding: 24px;
    }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: #8b8d9a; font-size: 13px; margin: 0 0 20px; }
    .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
    input, button {
      font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid #2a2c38;
      background: #15161e; color: #e7e8ee;
    }
    button { cursor: pointer; background: #2f6df6; border-color: #2f6df6; }
    button:hover { background: #2257d6; }
    .stat { color: #8b8d9a; font-size: 13px; }
    .msg { padding: 12px; border-radius: 8px; background: #1c1422; color: #ff9a9a; margin-bottom: 16px; display: none; }
    .wrap { overflow-x: auto; border: 1px solid #1f2029; border-radius: 12px; }
    table { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 13px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #1f2029; vertical-align: top; }
    th { color: #8b8d9a; font-weight: 600; position: sticky; top: 0; background: #101119; }
    tr:hover td { background: #12131b; }
    .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .thumb { width: 120px; height: 76px; object-fit: cover; border-radius: 6px; border: 1px solid #2a2c38; background: #1a1b24; display: block; }
    .thumb-link { color: #6f9bff; font-size: 12px; }
    .scores { font-family: ui-monospace, monospace; font-size: 12px; color: #b7b9c6; white-space: pre; }
    .muted { color: #5b5d6b; }
  </style>
</head>
<body>
  <h1>Usage Log</h1>
  <p class="sub">Every successful dashboard audit — time, IP, uploaded screenshot, and scores.</p>

  <div class="bar">
    <input id="token" type="password" placeholder="STATS_TOKEN (leave empty if unset)" size="32" />
    <input id="limit" type="number" value="200" min="1" max="1000" style="width: 90px" />
    <button id="load">Load</button>
    <span class="stat" id="stat"></span>
  </div>

  <div class="msg" id="msg"></div>

  <div class="wrap">
    <table>
      <thead>
        <tr><th>When</th><th>IP</th><th>Context</th><th>Scores</th><th>Screenshot</th></tr>
      </thead>
      <tbody id="rows"><tr><td colspan="5" class="muted">Enter token (if set) and click Load.</td></tr></tbody>
    </table>
  </div>

  <script>
    var tokenEl = document.getElementById('token');
    var limitEl = document.getElementById('limit');
    var rowsEl = document.getElementById('rows');
    var statEl = document.getElementById('stat');
    var msgEl = document.getElementById('msg');

    // Prefill token from ?token= for convenience.
    var qsToken = new URLSearchParams(location.search).get('token');
    if (qsToken) tokenEl.value = qsToken;

    function tokenQuery() {
      var t = tokenEl.value.trim();
      return t ? '?token=' + encodeURIComponent(t) : '';
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }

    function fmtScores(scores) {
      if (!scores || typeof scores !== 'object') return '';
      var parts = [];
      if (typeof scores.overall === 'number') parts.push('overall ' + scores.overall);
      if (scores.categories) {
        Object.keys(scores.categories).forEach(function (k) {
          var c = scores.categories[k];
          if (c && typeof c.score === 'number') parts.push(k + ' ' + c.score);
        });
      }
      return parts.join('\n');
    }

    function showMsg(text) {
      msgEl.textContent = text;
      msgEl.style.display = text ? 'block' : 'none';
    }

    function load() {
      showMsg('');
      statEl.textContent = 'Loading…';
      var q = tokenQuery();
      var limit = Math.min(Math.max(parseInt(limitEl.value, 10) || 200, 1), 1000);
      var sep = q ? '&' : '?';
      fetch('/api/admin/log' + q + sep + 'limit=' + limit)
        .then(function (r) {
          if (r.status === 401) throw new Error('Unauthorized — check the STATS_TOKEN.');
          if (!r.ok) throw new Error('Request failed (' + r.status + ').');
          return r.json();
        })
        .then(function (data) {
          var rows = (data && data.rows) || [];
          statEl.textContent = rows.length + ' row' + (rows.length === 1 ? '' : 's');
          if (!rows.length) {
            rowsEl.innerHTML = '<tr><td colspan="5" class="muted">No usage recorded yet.</td></tr>';
            return;
          }
          rowsEl.innerHTML = rows.map(function (row) {
            var when = new Date(row.at).toLocaleString();
            var imgUrl = '/api/admin/image/' + row.id + tokenQuery();
            var cell = row.imagePath
              ? '<a class="thumb-link" href="' + imgUrl + '" target="_blank" rel="noopener">' +
                '<img class="thumb" src="' + imgUrl + '" alt="screenshot ' + row.id + '" loading="lazy" /></a>'
              : '<span class="muted">expired / none</span>';
            return '<tr>' +
              '<td>' + esc(when) + '</td>' +
              '<td class="ip">' + esc(row.ip) + '</td>' +
              '<td>' + esc(row.context) + '</td>' +
              '<td class="scores">' + esc(fmtScores(row.scores)) + '</td>' +
              '<td>' + cell + '</td>' +
              '</tr>';
          }).join('');
        })
        .catch(function (e) {
          statEl.textContent = '';
          rowsEl.innerHTML = '<tr><td colspan="5" class="muted">—</td></tr>';
          showMsg(e.message || 'Failed to load.');
        });
    }

    document.getElementById('load').addEventListener('click', load);
    tokenEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') load(); });
    // Auto-load if a token was supplied in the URL.
    if (qsToken) load();
  </script>
</body>
</html>
